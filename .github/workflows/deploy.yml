name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verifikasi kontrak (mock + BE + live URL)
        run: |
          node test-mock-api.js
          node test-be.js
          node test-fe-live-url.js

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy ke Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"
