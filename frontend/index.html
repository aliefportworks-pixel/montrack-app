<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Montrack — aplikasi pencatatan keuangan pribadi berbasis Google Sheets." />
  <title>Montrack — Keuangan Pribadi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#000000',
            surface: '#1C1C1E',
            variant: '#2C2C2E',
            primary: '#FFFFFF',
            secondary: '#8E8E93',
            edge: '#38383A',
            chart: '#98A2F3',
            danger: '#FF453A',
            success: '#30D158',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          borderRadius: {
            card: '28px',
            panel: '20px',
            box: '16px',
            chip: '12px',
          },
          boxShadow: {
            glow: '0 8px 32px rgba(152, 162, 243, 0.15)',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="bg-background text-primary font-sans antialiased">
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="./mock/data.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/services/api.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/components/spinner.js"></script>
  <script src="./js/components/toast.js"></script>
  <script src="./js/components/confirm-modal.js"></script>
  <script src="./js/components/bottom-nav.js"></script>
  <script src="./js/components/balance-card.js"></script>
  <script src="./js/components/quick-actions.js"></script>
  <script src="./js/components/transaction-item.js"></script>
  <script src="./js/components/login-view.js"></script>
  <script src="./js/components/register-view.js"></script>
  <script src="./js/components/home-view.js"></script>
  <script src="./js/components/transaction-form-view.js"></script>
  <script src="./js/components/history-view.js"></script>
  <script src="./js/components/analytics-view.js"></script>
  <script src="./js/components/settings-view.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
